name: Build and deploy blog

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install media and notebook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install -r requirements.txt
      - name: Build and validate
        env:
          JEKYLL_ENV: production
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: blog-site
          path: _site
          include-hidden-files: true

  deploy:
    # PRs and manual branch previews only build. Publication remains master-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blog-site
          path: _site
      - name: Publish to existing Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
