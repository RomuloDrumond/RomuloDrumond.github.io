name: Build and deploy isolated preview

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'RomuloDrumond/blog-v12-preview' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install media and notebook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install -r requirements.txt
      - name: Check production build and prepare isolated preview
        env:
          JEKYLL_ENV: production
        run: |
          make check
          make preview
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: _preview
          include-hidden-files: true

  deploy:
    if: github.repository == 'RomuloDrumond/blog-v12-preview' && github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blog-preview
          path: _preview
      - name: Verify domain isolation
        run: test ! -e _preview/CNAME
      - name: Publish only to this preview repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _preview
